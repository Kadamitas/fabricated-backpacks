name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-server-and-artifact:
    name: Java 25 unit, server, assets, artifact and rendered-client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      # Software audio still exercises decoding and SoundManager behavior; it
      # is not evidence of audible output or the separate two-client audio gate.
      ALSOFT_DRIVERS: 'null'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check deterministic assets and evidence-checker rejection rules
        run: |
          python tools/generate_assets.py --check
          python tools/test_verify_evidence.py
          python tools/test_run_multiplayer.py
      - name: Start a fresh verification record
        run: python tools/verify_evidence.py begin
      - name: Execute unit and real native server tests and build the production JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --no-build-cache --rerun-tasks test runGameTestServer jar
      - name: Audit assets against the exact resolved Minecraft client
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          gradle_home = Path(os.environ.get('GRADLE_USER_HOME', Path.home() / '.gradle'))
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          jar = gradle_home / f"caches/neoformruntime/artifacts/minecraft_{properties['minecraft_version']}_client.jar"
          if not jar.is_file():
              raise SystemExit(f'Missing NeoForm original target client JAR: {jar}')
          subprocess.run([sys.executable, 'tools/test_assets.py', '--minecraft-jar', str(jar)], check=True)
          PY
      - name: Require exact discovery, fresh passing reports and a clean production JAR
        run: python tools/verify_evidence.py check
      - name: Install virtual display for non-invasive automated acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopengl0 libopenal1 mesa-utils mesa-vulkan-drivers
      # Exercise the native multiplayer bootstrap first for fast diagnostics;
      # full rendered/restart acceptance remains mandatory before bundling.
      - name: Run actual two-JVM multiplayer acceptance
        run: timeout --signal=INT --kill-after=60 25m xvfb-run -a -s '-screen 0 1280x800x24' python tools/run_multiplayer.py
      - name: Run full native client and separate-JVM restart acceptance
        run: |
          # A loading-error screen or a stalled harness must fail the step, not idle until the job limit.
          timeout --signal=INT --kill-after=60 20m xvfb-run -a -s '-screen 0 1280x800x24' bash -c 'glxinfo -B && exec ./gradlew --no-daemon --max-workers=2 --console=plain runClientGameTest'
          timeout --signal=INT --kill-after=60 15m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew --no-daemon --max-workers=2 --console=plain runClientGameTest -PclientScenario=restart
          mkdir -p .codex-local/client-evidence/restart-screenshots
          cp -p build/run/clientGameTest/screenshots/*.png .codex-local/client-evidence/restart-screenshots/
      - name: Bundle stable release with explicitly automated-only verification
        run: ./gradlew --no-daemon --max-workers=2 --console=plain releaseBundle
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          if-no-files-found: error
          path: release/
      - name: Upload diagnostics and automated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-java25-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/test/
            build/gametest-results.xml
            build/verification/start.json
            build/verification/automated.json
            build/verification/release.json
            build/verification/multiplayer.json
            .codex-local/client-evidence/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/crash-reports/
            run/logs/
            run/crash-reports/

# Release receipts explicitly omit owner-waived manual testing. Software audio
# checks decoding and real client channel behavior, not human-audible output.
