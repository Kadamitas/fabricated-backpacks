name: Verify Minecraft 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Java 21 / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            gradle_flags: ''
            evidence_flags: ''
          - name: cobblemon-1.7.3
            gradle_flags: '-PwithCobblemon=true'
            evidence_flags: '--with-cobblemon'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check deterministic assets and evidence rejection rules
        run: |
          python tools/generate_assets.py --check
          python tools/test_verify_evidence.py
          python tools/test_verify_compatibility.py
      - name: Start a fresh target-specific verification record
        run: python tools/verify_compatibility.py begin ${{ matrix.evidence_flags }}
      - name: Run unit and actual server tests and remap the production artifact
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --no-build-cache --rerun-tasks test runGameTest build ${{ matrix.gradle_flags }}
      - name: Audit assets against the exact target Minecraft client
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          gradle_home = Path(os.environ.get('GRADLE_USER_HOME', Path.home() / '.gradle'))
          jar = gradle_home / 'caches/fabric-loom/1.21.1/minecraft-client.jar'
          if not jar.is_file():
              raise SystemExit(f'Missing original target client JAR: {jar}')
          subprocess.run([sys.executable, 'tools/test_assets.py', '--minecraft-jar', str(jar)], check=True)
          PY
      - name: Require exact discovery, loaded target versions and a clean remapped artifact
        run: python tools/verify_compatibility.py check ${{ matrix.evidence_flags }}
      - name: Upload scoped diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-mc1.21.1-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/test/
            build/gametest-results.xml
            build/verification/compatibility*.json

# This workflow proves only unit/server coverage for the exact loaded target.
# It never creates client, manual or release acceptance evidence.
