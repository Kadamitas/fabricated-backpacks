name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-server-and-artifact:
    name: Java 25 unit, server, assets and artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check deterministic assets and evidence-checker rejection rules
        run: |
          python tools/generate_assets.py --check
          python tools/test_verify_evidence.py
          python tools/test_run_multiplayer.py
      - name: Compute the production hash of the shipped mod
        id: production
        run: python tools/ci_ledger.py hash
      - name: Restore the passed-stage ledger for this branch and production hash
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-ledger
          key: passed-${{ github.ref_name }}-${{ steps.production.outputs.hash }}-${{ github.run_id }}
          restore-keys: passed-${{ github.ref_name }}-${{ steps.production.outputs.hash }}-
      - name: Start a fresh verification record
        run: python tools/verify_evidence.py begin
      - name: Skip unit and server tests only if they passed for this exact production hash
        id: unit
        run: python tools/ci_ledger.py check unit-server
      - name: Execute unit and real server tests and build the production JAR
        if: steps.unit.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --no-build-cache --rerun-tasks test runGameTest jar
      - name: Build the production JAR (unit and server tests already passed for this production hash)
        if: steps.unit.outputs.skip == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --no-build-cache --rerun-tasks jar
      - name: Audit assets against the exact resolved Minecraft client
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          gradle_home = Path(os.environ.get('GRADLE_USER_HOME', Path.home() / '.gradle'))
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          jar = gradle_home / f"caches/fabric-loom/{properties['minecraft_version']}/minecraft-client.jar"
          if not jar.is_file():
              raise SystemExit(f'Missing Loom original target client JAR: {jar}')
          subprocess.run([sys.executable, 'tools/test_assets.py', '--minecraft-jar', str(jar)], check=True)
          PY
      - name: Require exact discovery, fresh passing reports and a clean production JAR
        run: python tools/verify_evidence.py check
      - name: Record the unit and server pass in the ledger
        if: steps.unit.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq '{unit_tests, unit_test_classes, unit_test_methods, server_tests, mod_server_tests}' build/verification/automated.json > build/verification/unit-server-summary.json
          python tools/ci_ledger.py record unit-server --summary build/verification/unit-server-summary.json
      - name: Skip the rendered client stages only if they passed for this exact production hash
        id: client
        run: |
          python tools/ci_ledger.py check client-full
          python tools/ci_ledger.py check client-restart --output restart
          python tools/ci_ledger.py check multiplayer --output multiplayer
      - name: Install virtual display for non-invasive automated acceptance
        if: steps.client.outputs.skip != 'true' || steps.client.outputs.multiplayer != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopengl0 libopenal1 mesa-utils mesa-vulkan-drivers
      - name: Run full client and separate-JVM restart acceptance
        if: steps.client.outputs.skip != 'true'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew --no-daemon --max-workers=2 --console=plain runClientGameTest
          xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew --no-daemon --max-workers=2 --console=plain runClientGameTest -PclientScenario=restart
          mkdir -p .codex-local/client-evidence/restart-screenshots
          cp -p build/run/clientGameTest/screenshots/*.png .codex-local/client-evidence/restart-screenshots/
      - name: Record the full and restart client passes in the ledger
        if: steps.client.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq '{pid, checks: (.checks | length)}' .codex-local/client-evidence/full-pass.json > build/verification/client-full-summary.json
          jq '{writer_pid, reader_pid}' .codex-local/client-evidence/restart-pass.json > build/verification/client-restart-summary.json
          python tools/ci_ledger.py record client-full --summary build/verification/client-full-summary.json
          python tools/ci_ledger.py record client-restart --summary build/verification/client-restart-summary.json
      - name: Run actual two-JVM multiplayer acceptance
        if: steps.client.outputs.multiplayer != 'true'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python tools/run_multiplayer.py
      - name: Record the multiplayer pass in the ledger
        if: steps.client.outputs.multiplayer != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq '{run_id, host_pid, guest_pid, host_exit, guest_exit}' build/verification/multiplayer.json > build/verification/multiplayer-summary.json
          python tools/ci_ledger.py record multiplayer --summary build/verification/multiplayer-summary.json
      - name: Bundle stable release with explicitly automated-only verification
        run: ./gradlew --no-daemon --max-workers=2 --console=plain releaseBundle
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-${{ github.run_id }}
          if-no-files-found: error
          path: release/
      - name: Save the passed-stage ledger (only stages that passed in this job are ever recorded)
        if: ${{ !cancelled() && hashFiles('.ci-ledger/ledger.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-ledger
          key: passed-${{ github.ref_name }}-${{ steps.production.outputs.hash }}-${{ github.run_id }}
      - name: Upload diagnostics and automated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-java25-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/test/
            build/gametest-results.xml
            build/verification/start.json
            build/verification/automated.json
            build/verification/release.json
            build/verification/multiplayer.json
            build/verification/skipped.json
            .ci-ledger/
            .codex-local/client-evidence/
            build/run/clientGameTest/logs/

  rendered-client:
    name: Rendered client and separate-JVM restart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      # Software audio still exercises decoding and SoundManager behavior; it
      # is not evidence of audible output or the separate two-client audio gate.
      ALSOFT_DRIVERS: 'null'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compute the production hash of the shipped mod
        id: production
        run: python3 tools/ci_ledger.py hash
      - name: Restore the passed-stage ledger for this branch and production hash
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-ledger
          key: passed-${{ github.ref_name }}-${{ steps.production.outputs.hash }}-${{ github.run_id }}
          restore-keys: passed-${{ github.ref_name }}-${{ steps.production.outputs.hash }}-
      - name: Skip the rendered client only if it passed for this exact production hash
        id: client
        run: python3 tools/ci_ledger.py check client-full
      - name: Install virtual display and software rendering
        if: steps.client.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopengl0 libopenal1 mesa-utils mesa-vulkan-drivers
      - name: Run existing full rendered-client tests
        if: steps.client.outputs.skip != 'true'
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash -c 'glxinfo -B && exec ./gradlew --no-daemon --max-workers=2 --console=plain runClientGameTest'
      - name: Reopen the saved world in a separate client JVM
        if: steps.client.outputs.skip != 'true'
        run: xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew --no-daemon --max-workers=2 --console=plain runClientGameTest -PclientScenario=restart
      - name: Upload client diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-verification-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/crash-reports/
            .codex-local/client-evidence/full-pass.json
            .codex-local/client-evidence/restart-pass.json
            .codex-local/client-evidence/full-screenshots/

# Release receipts explicitly omit owner-waived manual testing. Software audio
# checks decoding and real client channel behavior, not human-audible output.
