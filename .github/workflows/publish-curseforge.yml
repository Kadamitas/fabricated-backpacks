name: Publish verified release to CurseForge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example v1.0.0+mc26.3)
        required: true
      loader:
        description: Loader artifact to publish
        required: true
        type: choice
        options: [fabric, quilt, forge, neoforge]

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.tag }}-${{ inputs.loader }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      LOADER: ${{ inputs.loader }}
    steps:
      # No checkout, build script, third-party action, or downloaded executable
      # runs in the publishing job. The token is exposed only to the upload step.
      - name: Download and verify the release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+mc(26\.3|1\.21\.1)$ ]] || { echo "A stable, Minecraft-qualified release tag is required"; exit 1; }
          case "$LOADER" in fabric|quilt|forge|neoforge) ;; *) exit 1;; esac
          version="${RELEASE_TAG#v}"
          prefix="fabricated-backpacks"
          if [[ "$LOADER" != fabric ]]; then prefix="$prefix-$LOADER"; fi
          artifact="$prefix-$version.jar"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,body > release.json
          jq -e '.isDraft == false and .isPrerelease == false' release.json > /dev/null
          mkdir artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern "$artifact" --pattern "$artifact.sha256" --pattern "$artifact.release.json"
          cd artifacts
          # Validate the named file directly; never interpret filenames supplied
          # by a downloaded checksum file as paths or command-line options.
          digest="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          [[ "$(cat "$artifact.sha256")" == "$digest  $artifact" ]]
          if [[ "$version" == 1.0.0+mc1.21.1 && "$LOADER" == fabric ]]; then
            # This legacy target has no Fabric client GameTest API. Preserve
            # its honest unit/server scope and require both tested profiles.
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir . --pattern "$artifact.cobblemon.json"
            for receipt in "$artifact.release.json" "$artifact.cobblemon.json"; do
              jq -e --arg digest "$digest" \
                '.schema == 1 and .passed == true and .scope == "unit-and-server/compatibility"
                 and .minecraft_version == "1.21.1" and .artifact.sha256 == $digest
                 and .unit_tests > 0 and .server_tests > 0' "$receipt" > /dev/null
            done
            jq -e '.with_cobblemon == false' "$artifact.release.json" > /dev/null
            jq -e '.with_cobblemon == true and .cobblemon_tests == 2' "$artifact.cobblemon.json" > /dev/null
          else
            jq -e --arg digest "$digest" --arg version "$version" --arg minecraft "${version##*+mc}" \
            '.schema == 1 and .passed == true and (.scope == "release" or .scope == "release-automated")
              and .client.full.passed == true and .client.restart.passed == true and .client.multiplayer.passed == true
             and .artifact.sha256 == $digest and .artifact.version == $version and .artifact.minecraft == $minecraft' \
            "$artifact.release.json" > /dev/null
          fi
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Authenticate and upload the verified artifact
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSEFORGE_API_TOKEN" || { echo "Missing CurseForge upload token"; exit 1; }
          report_api_error() {
            python3 - "$1" <<'PY'
          import json, os, pathlib, sys
          try:
              data = json.loads(pathlib.Path(sys.argv[1]).read_text())
              safe = {key: data[key] for key in ('error', 'errorMessage', 'message', 'errors') if key in data} if isinstance(data, dict) else {}
              print('CurseForge error: ' + json.dumps(safe).replace(os.environ['CURSEFORGE_API_TOKEN'], '[REDACTED]')[:2000])
          except Exception:
              print('CurseForge returned a non-JSON error; response omitted.')
          PY
          }
          [[ "$CURSEFORGE_PROJECT_ID" == 1672591 ]] || { echo "Unexpected CurseForge project ID"; exit 1; }
          # The endpoint returns 401 without valid credentials. No response body
          # or token is printed; a failed authentication stops before any upload.
          curl --silent --show-error --fail-with-body --proto '=https' \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --output versions.json https://minecraft.curseforge.com/api/game/versions || { report_api_error versions.json; exit 1; }
          echo 'CurseForge game-version lookup succeeded.'
          minecraft="${MOD_VERSION##*+mc}"
          case "$LOADER" in fabric) loader_name=Fabric;; quilt) loader_name=Quilt;; forge) loader_name=Forge;; neoforge) loader_name=NeoForge;; esac
          jq -e --arg game "$minecraft" --arg loader "$loader_name" \
            'any(.[]; .name == $game) and any(.[]; .name == $loader)' versions.json > /dev/null
          dependencies='[]'
          if [[ "$LOADER" == fabric || "$LOADER" == quilt ]]; then
            dependencies='[{"slug":"fabric-api","projectID":306612,"type":"requiredDependency"}]'
          fi
          jq --arg display "Fabricated Backpacks ${MOD_VERSION%%+*} for $loader_name — Minecraft $minecraft" \
            --arg game "$minecraft" --arg loader "$loader_name" --argjson dependencies "$dependencies" \
            '{displayName:$display,changelog:.body,changelogType:"markdown",releaseType:"release",
              gameVersionNames:[$game,$loader],relations:{projects:$dependencies}}' release.json > metadata.json
          curl --silent --show-error --fail-with-body --proto '=https' \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --form "metadata=<metadata.json" --form "file=@artifacts/$ARTIFACT" \
            --output response.json \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file" || { report_api_error response.json; exit 1; }
          file_id="$(jq -er '.id | select(type == "number" and . > 0)' response.json)"
          echo "Uploaded CurseForge file $file_id ($LOADER). CurseForge moderation may still be pending." >> "$GITHUB_STEP_SUMMARY"
