plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = 'com.kadamitas'
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

configurations {
    quiltRuntime {
        canBeConsumed = false
    }
    productionMods {
        canBeConsumed = false
        transitive = false
    }
}

sourceSets {
    quiltDevelopment
}

loom {
    splitEnvironmentSourceSets()
    mods {
        fabricated_backpacks {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        fabricated_backpacks_quilt_dev {
            sourceSet sourceSets.quiltDevelopment
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'fabricated_backpacks_tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        // Multiplayer preparation must never clear another running client's directory.
        clearRunDirectory = !providers.gradleProperty('multiplayerRunId').isPresent()
    }
}

dependencies {
    quiltRuntime "org.quiltmc:quilt-loader:${quilt_loader_version}"
    quiltRuntime 'org.quiltmc:quilt-json5:1.0.4+final'
    quiltRuntime 'org.quiltmc:quilt-config:1.3.3'
    quiltRuntime 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    ['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each {
        quiltRuntime "org.ow2.asm:${it}:9.10.1"
    }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation include('teamreborn:energy:5.0.0')
    // Optional client integration. JEI is neither required nor embedded in the mod JAR.
    clientCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    gametestCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    if (providers.gradleProperty('withJei').map { it.toBoolean() }.getOrElse(false)) {
        clientRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
        gametestRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
        productionMods "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    }
    testCompileOnly "org.quiltmc:quilt-loader:${quilt_loader_version}"
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:unchecked', '-Xlint:deprecation'])
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    def originalClasspath = classpath
    classpath = originalClasspath.filter {
        !it.name.startsWith('fabric-loader-') && !it.name.startsWith('sponge-mixin-')
                && !it.name.startsWith('mixinextras-fabric-')
    } + configurations.quiltRuntime + sourceSets.quiltDevelopment.output
    systemProperty 'fabricated.backpacks.unitEvidence', layout.buildDirectory.file('test-results/test/unit-execution.json').get().asFile.absolutePath
    systemProperty 'fabricated.backpacks.quiltUnitGameDir', layout.buildDirectory.dir('run/quiltUnit').get().asFile.absolutePath
    testLogging { events 'failed', 'skipped' }
}

tasks.named('runGameTest') {
    systemProperty 'fabric-api.gametest.report-file', layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath
    providers.gradleProperty('gameTestFilter').orNull?.with { selector ->
        systemProperty 'fabric-api.gametest.filter', selector
    }
}

tasks.named('runClientGameTest') {
    systemProperty 'fabricated.backpacks.clientScenario', providers.gradleProperty('clientScenario').getOrElse('full')
    systemProperty 'fabricated.backpacks.evidenceRoot', layout.projectDirectory.dir('.codex-local/client-evidence').asFile.absolutePath
}

apply from: 'tools/multiplayer.gradle'

// Compile the shared Fabric API source and unit fixtures unchanged. Real game
// launches use Quilt's official entry points and loader, never Fabric's loader.
loom.runs.configureEach {
    defaultMainClass = 'com.kadamitas.fabricatedbackpacks.dev.QuiltDevelopmentLauncher'
    getSystemProperties().put('fabricated.backpacks.quiltEnvironment', environment)
}
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
    def originalClasspath = classpath
    classpath = originalClasspath.filter {
        !it.name.startsWith('fabric-loader-') && !it.name.startsWith('sponge-mixin-')
                && !it.name.startsWith('mixinextras-fabric-')
    } + configurations.quiltRuntime + sourceSets.quiltDevelopment.output
    systemProperty 'loader.gameVersion', project.minecraft_version
}

// Retain Loom's isolated installed-JAR/asset launcher, but replace its Fabric
// bootstrap and runtime with the exact Quilt loader used by this branch.
abstract class QuiltProductionClientTask extends net.fabricmc.loom.task.prod.ClientProductionRunTask {
    @Classpath
    abstract ConfigurableFileCollection getQuiltClasspath()

    @Override
    protected java.util.stream.Stream<File> streamClasspath() {
        java.util.stream.Stream.concat(super.streamClasspath().filter {
            !it.name.startsWith('fabric-loader-') && !it.name.startsWith('sponge-mixin-')
                    && !it.name.startsWith('mixinextras-fabric-')
        }, quiltClasspath.files.stream())
    }

    @Override
    protected void configureMainClass(org.gradle.process.ExecSpec spec) {
        spec.args('org.quiltmc.loader.impl.launch.knot.KnotClient')
    }

    @Override
    protected void configureJvmArgs(org.gradle.process.ExecSpec spec) {
        super.configureJvmArgs(spec)
        spec.args('-Dloader.addMods=' + mods.files.collect { it.absolutePath }.join(File.pathSeparator))
    }
}

tasks.register('runProductionClient', QuiltProductionClientTask) {
    group = 'verification'
    description = 'Open an isolated real Minecraft instance using the built release JAR, without the test mod.'
    mods.from(tasks.named('jar').flatMap { it.archiveFile }, configurations.productionMods)
    quiltClasspath.from(configurations.quiltRuntime)
    runDir = layout.projectDirectory.dir('.codex-local/manual-client')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    useXVFB = false
    jvmArgs.add('-Xmx3G')
    programArgs.addAll('--username', 'BackpackQA', '--width', '1280', '--height', '800')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE-fabricated-backpacks.txt' } }
}

tasks.register('verifyReleaseEvidence', Exec) {
    group = 'verification'
    description = 'Require fresh build, server, real-client and manual evidence before bundling a release.'
    dependsOn tasks.named('build')
    commandLine 'python', 'tools/verify_evidence.py', 'check', '--release'
}

tasks.register('releaseBundle') {
    group = 'build'
    description = 'Collect verified release jars and checksums.'
    dependsOn tasks.named('verifyReleaseEvidence')
    doLast {
        def destination = layout.projectDirectory.dir("release/${project.version}").asFile.toPath()
        java.nio.file.Files.createDirectories(destination)
        ['jar', 'sourcesJar'].each { taskName ->
            def artifact = tasks.named(taskName).get().archiveFile.get().asFile.toPath()
            def target = destination.resolve(artifact.fileName)
            java.nio.file.Files.copy(artifact, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(java.nio.file.Files.readAllBytes(target))
            def checksum = java.util.HexFormat.of().formatHex(digest)
            java.nio.file.Files.writeString(destination.resolve("${artifact.fileName}.sha256"), "${checksum}  ${artifact.fileName}\n")
        }
    }
}
