import groovy.json.JsonOutput
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest

// Prepare both launch descriptions in one build; tools/run_multiplayer.py starts them after Gradle exits.
// Both commands derive from the automated client run (runClient with the harness enabled), with only
// the role-specific scenario, profile and directory changed.
def requestedId = providers.gradleProperty('multiplayerRunId').orNull
def scenario = providers.gradleProperty('multiplayerScenario').getOrElse('full')
if (!(scenario in ['full', 'automation'])) throw new GradleException('multiplayerScenario must be full or automation.')
def prepareClients = tasks.register('prepareMultiplayerClients') {
    group = 'verification'
    description = 'Export two exact, separate real-client commands without starting either JVM.'
    outputs.upToDateWhen { false }
}
if (requestedId == null) {
    prepareClients.configure {
        doLast { throw new GradleException('Use tools/run_multiplayer.py, or supply -PmultiplayerRunId=<fresh canonical UUID>.') }
    }
} else {
    String runId
    try { runId = UUID.fromString(requestedId).toString() }
    catch (IllegalArgumentException invalid) { throw new GradleException('multiplayerRunId must be a canonical UUID.', invalid) }
    if (runId != requestedId) throw new GradleException('multiplayerRunId must use canonical lowercase UUID spelling.')
    def evidenceRoot = layout.projectDirectory.dir('.codex-local/client-evidence').asFile.toPath().toAbsolutePath().normalize()
    def launchRoot = evidenceRoot.resolve("multiplayer-launch-${runId}")
    def evidence = evidenceRoot.resolve("multiplayer-${runId}")
    def roles = ['host': 'BackpackHost', 'guest': 'BackpackGuest']
    def record = layout.buildDirectory.file("multiplayer/launch-record-${runId}.args").get().asFile.toPath()
    // ForgeGradle assembles the launch command only inside the run task. Run it with a recorder
    // standing in for the JVM: the exact command is written down and no game process starts.
    def recorder = layout.projectDirectory.file('tools/record-launch.sh')
    def realLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    tasks.matching { it.name == 'runClient' }.configureEach {
        javaLauncher.set(realLauncher.map { real ->
            [getExecutablePath: { -> recorder }, getMetadata: { -> real.metadata }] as org.gradle.jvm.toolchain.JavaLauncher
        })
        environment 'FABRICATED_BACKPACKS_LAUNCH_RECORD', record.toString()
        doFirst { Files.createDirectories(record.parent); Files.deleteIfExists(record) }
    }
    prepareClients.configure {
        dependsOn tasks.named('gametestClasses'), tasks.matching { it.name == 'runClient' }
        doLast {
            for (def directory = evidenceRoot; directory != null; directory = directory.parent) {
                if (Files.isSymbolicLink(directory)) throw new GradleException('Evidence paths must not traverse symbolic links.')
            }
            if (Files.exists(launchRoot, LinkOption.NOFOLLOW_LINKS) || Files.exists(evidence, LinkOption.NOFOLLOW_LINKS))
                throw new GradleException('This multiplayer run ID already exists; choose a fresh UUID.')
            Files.createDirectories(evidenceRoot)
            Files.createDirectory(launchRoot)
            def writeNew = { path, String value -> Files.writeString(path, value, StandardCharsets.UTF_8, StandardOpenOption.CREATE_NEW) }
            def json = { value -> JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n' }
            def digest = { path ->
                def hash = MessageDigest.getInstance('SHA-256')
                path.toFile().withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) >= 0) if (count > 0) hash.update(buffer, 0, count)
                }
                HexFormat.of().formatHex(hash.digest())
            }
            def quoteArgument = { String value ->
                if (value.indexOf(0) >= 0 || value.contains('\n') || value.contains('\r')) throw new GradleException('A Java argument contains an unsupported control character.')
                '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
            }
            // One argument per line, as the toolchain writes its @-files; quoted lines use Java's escaping.
            def parseArgumentLine = { String line ->
                String text = line.trim()
                if (!text.startsWith('"')) return text
                StringBuilder value = new StringBuilder()
                for (int index = 1; index < text.length(); index++) {
                    char current = text.charAt(index)
                    if (current == (char) '\\' && index + 1 < text.length()) { value.append(text.charAt(++index)); continue }
                    if (current == (char) '"') {
                        if (index != text.length() - 1) throw new GradleException('Unsupported quoted argument: ' + line)
                        return value.toString()
                    }
                    value.append(current)
                }
                throw new GradleException('Unterminated quoted argument: ' + line)
            }
            def expandArgumentFile = { java.nio.file.Path source ->
                List<String> expanded = []
                Files.readAllLines(source, StandardCharsets.UTF_8).each { String line ->
                    String text = line.trim()
                    if (text.isEmpty() || text.startsWith('#')) return
                    if (text.startsWith('@')) throw new GradleException('Unexpected nested argument file in ' + source)
                    expanded.add(parseArgumentLine(text))
                }
                expanded
            }
            def task = tasks.named('runClient').get()
            if (!Files.isRegularFile(record)) throw new GradleException('The client run did not record its launch command: ' + record)
            List<String> recorded = []
            for (String argument : new String(Files.readAllBytes(record), StandardCharsets.UTF_8).split('\u0000')) {
                if (argument.isEmpty()) continue
                if (argument.startsWith('@')) recorded.addAll(expandArgumentFile(java.nio.file.Path.of(argument.substring(1))))
                else recorded.add(argument)
            }
            String mainClass = task.mainClass.get()
            int mainIndex = recorded.indexOf(mainClass)
            if (mainIndex < 0) throw new GradleException('The recorded command does not launch ' + mainClass)
            List<String> baseJvm = new ArrayList<>(recorded.subList(0, mainIndex))
            List<String> baseProgram = new ArrayList<>(recorded.subList(mainIndex + 1, recorded.size()))
            if (!baseJvm.contains('-Dfabricated.backpacks.clientTests=true')) throw new GradleException('The client run is not configured for the automated harness.')
            if (baseProgram.count('--username') != 1) throw new GradleException('The client run must have exactly one explicit username.')
            int classpathIndex = baseJvm.indexOf('-cp'); if (classpathIndex < 0) classpathIndex = baseJvm.indexOf('-classpath')
            if (classpathIndex < 0 || classpathIndex + 1 >= baseJvm.size()) throw new GradleException('The recorded command has no class path.')
            def commands = [:]
            Set<File> classpathFiles = new LinkedHashSet<>()
            baseJvm[classpathIndex + 1].split(File.pathSeparator).each { classpathFiles.add(new File(it)) }
            roles.each { role, username ->
                List<String> jvm = baseJvm.findAll { !it.startsWith('-Dfabricated.backpacks.clientScenario=') && !it.startsWith('-Xmx') }
                jvm.addAll(["-Dfabricated.backpacks.clientScenario=multiplayer_${role}".toString(),
                        "-Dfabricated.backpacks.multiplayerRunId=${runId}".toString(),
                        "-Dfabricated.backpacks.multiplayerScope=${scenario}".toString(),
                        "-Dfabricated.backpacks.evidenceRoot=${evidenceRoot}".toString(),
                        '-Djava.net.preferIPv4Stack=true', role == 'host' ? '-Xmx3G' : '-Xmx2G'])
                jvm = jvm.findAll { !it.startsWith('-Dfabricated.backpacks.evidenceRoot=') || it == "-Dfabricated.backpacks.evidenceRoot=${evidenceRoot}".toString() }
                List<String> program = new ArrayList<>(baseProgram)
                program.set(program.indexOf('--username') + 1, username)
                List<String> arguments = jvm + [mainClass] + program
                def argsFile = launchRoot.resolve(role + '.args')
                def probeFile = launchRoot.resolve(role + '-probe.args')
                writeNew(argsFile, arguments.collect(quoteArgument).join('\n') + '\n')
                writeNew(probeFile, (jvm + ['-version']).collect(quoteArgument).join('\n') + '\n')
                def directory = launchRoot.resolve(role)
                Files.createDirectory(directory)
                // The same explicit project test-EULA acceptance as runClientGameTest.
                writeNew(directory.resolve('eula.txt'), '# Synthetic acceptance server; the project test setup accepts the EULA.\neula=true\n')
                def configurationCopy = launchRoot.resolve(role + '-arguments.json')
                writeNew(configurationCopy, json([jvm: jvm, main: mainClass, program: program]))
                // Only the toolchain's own additions travel with the command; the controller keeps its environment.
                Map<String, String> environment = new LinkedHashMap<>()
                task.environment.each { key, value ->
                    if (key.toString() != 'FABRICATED_BACKPACKS_LAUNCH_RECORD' && System.getenv(key.toString()) != value.toString()) environment.put(key.toString(), value.toString())
                }
                commands[role] = [java: realLauncher.get().executablePath.asFile.absolutePath,
                        directory: directory.toString(), argument_file: argsFile.toString(), argument_sha256: digest(argsFile),
                        probe_file: probeFile.toString(), probe_sha256: digest(probeFile),
                        configuration_file: configurationCopy.toString(), configuration_sha256: digest(configurationCopy),
                        java_arguments: arguments, environment: environment, username: username,
                        stdout: launchRoot.resolve(role + '-stdout.log').toString(), stderr: launchRoot.resolve(role + '-stderr.log').toString()]
            }
            List<Map> inputs = []
            classpathFiles.add(project.file('src/gametest/resources'))
            classpathFiles.each { file ->
                if (file.isDirectory()) {
                    Files.walk(file.toPath()).withCloseable { paths ->
                        def members = paths.filter { Files.isRegularFile(it) }.sorted().toList()
                        inputs.add([path: file.absolutePath, directory: true,
                                    files: members.collect { it.toAbsolutePath().toString() }])
                        members.each { path ->
                            inputs.add([path: path.toAbsolutePath().toString(), sha256: digest(path)])
                        }
                    }
                } else if (file.isFile()) inputs.add([path: file.absolutePath, sha256: digest(file.toPath())])
                else if (file.name.endsWith('.jar')) throw new GradleException('Missing runtime library: ' + file)
                else inputs.add([path: file.absolutePath, missing: true])
            }
            writeNew(launchRoot.resolve('classpath-inputs.json'), json(inputs))
            def manifest = [schema: 2, run_id: runId, scope: scenario, prepared_at: java.time.Instant.now().toString(),
                    project: project.projectDir.absolutePath, mod_version: project.version.toString(),
                    minecraft_version: project.minecraft_version, evidence: evidence.toString(), commands: commands]
            writeNew(launchRoot.resolve('launch.json'), json(manifest))
            logger.lifecycle('MULTIPLAYER_PREPARED {}', launchRoot.resolve('launch.json'))
            logger.lifecycle('No Minecraft JVM has started. Launch with tools/run_multiplayer.py --skip-prepare --run-id {}', runId)
        }
    }
}
