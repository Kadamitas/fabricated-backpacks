plugins { id 'java' }

// Small, explicitly scoped porting regression suite. This does not replace the
// root build, all copied tests, a Minecraft launch, or the release evidence gate.
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
dependencies {
    implementation('net.neoforged:neoforge:26.3.0.7-beta:universal') { transitive = false }
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    main.java {
        srcDir '../../src/main/java'
        include 'com/kadamitas/fabricatedbackpacks/platform/neoforge/**'
        include 'com/kadamitas/fabricatedbackpacks/automation/conduit/ConduitBudget.java'
    }
    test.java {
        srcDir '../../src/test/java'
        include 'com/kadamitas/fabricatedbackpacks/platform/neoforge/**'
        include 'com/kadamitas/fabricatedbackpacks/automation/conduit/ConduitBudgetTest.java'
    }
}
test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
